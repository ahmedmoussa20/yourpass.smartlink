<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YourPass</title>

<meta name="robots" content="noindex,nofollow">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
document.addEventListener("DOMContentLoaded",()=>{

const androidLink="https://play.google.com/store/apps/details?id=com.yourpass.app";
const iosLink="https://apps.apple.com/eg/app/yourpass-jo/id6747829943";
const userAgent=navigator.userAgent||navigator.vendor||window.opera;

function redirect(url){
setTimeout(()=>{
window.location.replace(url);
},600);
}

if(/android/i.test(userAgent)){
redirect(androidLink);
}
else if(
/iPhone|iPad|iPod/.test(userAgent)||
(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)
){
redirect(iosLink);
}
else{
document.getElementById("buttons").style.display="flex";
}

});
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:Inter,sans-serif;
background:#F4FCF6;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
color:#111827;
}
.card{
width:100%;
max-width:480px;
background:#fff;
padding:55px 40px;
border-radius:24px;
box-shadow:0 20px 60px rgba(0,0,0,.08);
text-align:center;
animation:fade .7s ease;
}
.logo{
font-size:48px;
font-weight:800;
letter-spacing:-2px;
margin-bottom:18px;
color:#111827;
}
.subtitle{
font-size:20px;
font-weight:600;
color:#16A34A;
margin-bottom:20px;
}
.description{
font-size:17px;
line-height:1.7;
color:#6B7280;
margin-bottom:35px;
}
.loader{
width:42px;
height:42px;
border:4px solid #DCFCE7;
border-top:4px solid #16A34A;
border-radius:50%;
margin:0 auto 35px;
animation:spin 1s linear infinite;
}
#buttons{
display:none;
flex-direction:column;
gap:16px;
margin-top:20px;
}
.btn{
display:block;
padding:16px;
border-radius:14px;
text-decoration:none;
font-weight:700;
font-size:17px;
transition:.3s;
}
.android{background:#16A34A;color:white;}
.android:hover{background:#15803D;}
.ios{
background:white;
border:2px solid #16A34A;
color:#16A34A;
}
.ios:hover{background:#DCFCE7;}
.note{
margin-top:20px;
font-size:14px;
color:#9CA3AF;
}
@keyframes spin{100%{transform:rotate(360deg);}}
@keyframes fade{
from{opacity:0;transform:translateY(25px);}
to{opacity:1;transform:none;}
}
</style>

</head>
<body>

<div class="card">

<div class="logo">YourPass</div>

<div class="subtitle">Your fitness journey starts here</div>

<div class="loader"></div>

<div class="description">
Preparing your download...
<br><br>
You'll be redirected automatically in a moment.
</div>

<div id="buttons">

<a class="btn android" href="https://play.google.com/store/apps/details?id=com.yourpass.app">
Download for Android
</a>

<a class="btn ios" href="https://apps.apple.com/eg/app/yourpass-jo/id6747829943">
Download for iPhone
</a>

</div>

<div class="note">
If the automatic redirect doesn't work, choose your device above.
</div>

</div>

</body>
</html>
